basePath: /v1
definitions:
  data.Movie:
    properties:
      genres:
        items:
          type: string
        type: array
      id:
        type: integer
      runtime:
        example: 120 mins
        type: string
      title:
        type: string
      version:
        type: integer
      year:
        type: integer
    type: object
  data.User:
    properties:
      activated:
        type: boolean
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  main.movieCreateInput:
    properties:
      genres:
        example:
        - comedy
        - drama
        items:
          type: string
        type: array
      runtime:
        example: 97 mins
        type: string
      title:
        example: The Breakfast Club
        type: string
      year:
        example: 1985
        type: integer
    required:
    - genres
    - runtime
    - title
    - year
    type: object
  main.movieUpdateInput:
    properties:
      genres:
        example:
        - comedy
        - drama
        items:
          type: string
        type: array
      runtime:
        example: 97 mins
        type: string
      title:
        example: The Breakfast Club
        type: string
      year:
        example: 1985
        type: integer
    type: object
  main.registerUserInput:
    properties:
      email:
        example: jane@example.com
        format: email
        type: string
      name:
        example: Jane Doe
        type: string
      password:
        example: example-password
        type: string
    required:
    - email
    - name
    - password
    type: object
info:
  contact: {}
  description: API for managing movies.
  title: Greenlight API
  version: "1.0"
paths:
  /healthcheck:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Check API health
      tags:
      - System
  /movies:
    get:
      description: Returns a list of movies.
      parameters:
      - description: Title filter
        in: query
        name: title
        type: string
      - collectionFormat: csv
        description: Genre filters
        in: query
        items:
          type: string
        name: genres
        type: array
      - default: 1
        description: Page number
        in: query
        maximum: 10000000
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      - default: id
        description: Sort order
        enum:
        - id
        - title
        - year
        - runtime
        - -id
        - -title
        - -year
        - -runtime
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              movies:
                items:
                  $ref: '#/definitions/data.Movie'
                type: array
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List movies
      tags:
      - Movies
    post:
      consumes:
      - application/json
      parameters:
      - description: Movie details
        in: body
        name: movie
        required: true
        schema:
          $ref: '#/definitions/main.movieCreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              movie:
                $ref: '#/definitions/data.Movie'
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a movie
      tags:
      - Movies
  /movies/{id}:
    delete:
      parameters:
      - description: Movie ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              message:
                type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Delete a movie
      tags:
      - Movies
    get:
      parameters:
      - description: Movie ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              movie:
                $ref: '#/definitions/data.Movie'
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get a movie
      tags:
      - Movies
    patch:
      consumes:
      - application/json
      description: Only provided fields are updated.
      parameters:
      - description: Movie ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Movie details
        in: body
        name: movie
        required: true
        schema:
          $ref: '#/definitions/main.movieUpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              movie:
                $ref: '#/definitions/data.Movie'
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update a movie
      tags:
      - Movies
  /users:
    post:
      consumes:
      - application/json
      description: Creates an inactive user. Name must be at most 500 bytes; password
        must be between 8 and 72 bytes. Duplicate email addresses return a validation
        error.
      parameters:
      - description: User registration details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/main.registerUserInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              user:
                $ref: '#/definitions/data.User'
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Register a user
      tags:
      - Users
swagger: "2.0"
