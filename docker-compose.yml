version: '3.8'
services:
  postgres:
    container_name: greenlight
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: greenlight
    ports:
      - 5532:5432
    volumes:
      - greenlight_data:/var/lib/postgresql/data
    networks:
      - postgres
    restart: always

volumes:
  greenlight_data:


networks:
  postgres:
    driver: bridge